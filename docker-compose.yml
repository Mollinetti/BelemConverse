# BelemConverse local stack.
#
# Usage:
#   docker compose up --build       # backend on http://localhost:8000
#   docker compose --profile web up # backend + Flutter web on :8080
#
# Make sure ./models/llm/<your model>.gguf and ./data/canonical_places.jsonl
# exist on the host before starting; both directories are bind-mounted.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: belem-converse-api:latest
    container_name: belem-converse-api
    ports:
      - "8000:8000"
    environment:
      # Override these via .env if you want a different model / GPU setup.
      BELEM_DATA_DIR: /app/data
      CHROMA_PERSIST_DIR: /app/data/chroma_db
      BELEM_MODELS_DIR: /app/models
      LLM_N_GPU_LAYERS: ${LLM_N_GPU_LAYERS:-0}
      MODEL_GGUF_PATH: ${MODEL_GGUF_PATH:-/app/models/llm/Meta-Llama-3.1-8B-Instruct-Q5_K_M.gguf}
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  web:
    profiles: ["web"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pointed at the API container; override for cloud deploys.
        API_BASE_URL: http://localhost:8000
    image: belem-converse-web:latest
    container_name: belem-converse-web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
