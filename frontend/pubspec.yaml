name: belem_converse
description: "BelemConverse - Your AI-powered guide to Belém do Pará"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  
  # State management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.2.0
  
  # Location
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  
  # Maps (OpenStreetMap)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # URL launcher (for opening websites)
  url_launcher: ^6.2.5
  
  # Internationalization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # Enable localization
  generate: true
